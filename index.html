<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Para Ti ❤️</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f0f0f">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #3a3a3a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: 320px;
            background: linear-gradient(180deg, #1f1f1f, #0f0f0f);
            border-radius: 24px;
            padding: 24px;
            color: #fff;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            margin: 0 0 12px;
            font-size: 42px;
        }

        p {
            font-size: 11px;
            line-height: 1.4;
            color: #cfcfcf;
            margin-bottom: 18px;
        }

        .music-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #eaeaea;
            color: #000;
            border-radius: 8px;
            padding: 8px 10px;
            margin-bottom: 18px;
        }

        .music-img {
            width: 36px;
            height: 36px;
            border-radius: 4px;
            background: linear-gradient(45deg, #ff0066, #ffcc00, #00ccff);
        }

        .music-text {
            text-align: left;
            font-size: 12px;
        }

        .music-text strong {
            display: block;
        }

        .music-text span {
            font-size: 10px;
            color: #444;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 18px;
            background: #d9f1ff;
            color: #000;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Hola ❤️</h1>

        <p>
            Esto es algo pequeño pero hecho con mucho cariño solo para ti.<br>
            Gracias por existir, por sonreír y por hacer mis días mejores.
        </p>

        <div class="music-box">
            <div class="music-img"></div>
            <div class="music-text">
                <strong>WOUNDS & LOVE</strong>
                <span>Adeline Palmerston</span>
            </div>
        </div>

        <a href="#" class="btn">CONTINUAR →</a>
    </div>

    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("service-worker.js");
        }
    </script>

</body>
</html>
